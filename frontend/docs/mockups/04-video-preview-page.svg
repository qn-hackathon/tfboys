<svg width="1200" height="1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .header { fill: #ffffff; }
      .primary-btn { fill: #1890ff; }
      .secondary-btn { fill: #ffffff; stroke: #d9d9d9; stroke-width: 1; }
      .danger-btn { fill: #ff4d4f; }
      .card { fill: #ffffff; stroke: #e8e8e8; stroke-width: 1; }
      .player-bg { fill: #000000; }
      .player-controls { fill: #333333; opacity: 0.9; }
      .scene-thumb { fill: #f0f0f0; stroke: #d9d9d9; stroke-width: 1; }
      .scene-thumb-active { fill: #e6f7ff; stroke: #1890ff; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #262626; }
      .text-normal { font-family: Arial, sans-serif; font-size: 14px; fill: #262626; }
      .text-btn { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #ffffff; }
      .text-hint { font-family: Arial, sans-serif; font-size: 12px; fill: #8c8c8c; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="1200" height="1600"/>
  
  <!-- Header -->
  <rect class="header" width="1200" height="64" rx="0"/>
  <text x="40" y="42" class="text-title" font-size="24">🎬 TFBoys AI</text>
  <text x="1080" y="42" class="text-normal" text-anchor="middle">我的任务</text>
  
  <!-- Page Title -->
  <text x="600" y="140" class="text-title" text-anchor="middle">🎬 视频预览</text>
  <text x="600" y="170" class="text-hint" text-anchor="middle">任务 #002: 少年与猫的故事</text>
  
  <!-- Video Player -->
  <g transform="translate(100, 200)">
    <rect class="card" width="1000" height="600" rx="8"/>
    
    <!-- Player Screen -->
    <rect class="player-bg" x="20" y="20" width="960" height="540" rx="4"/>
    
    <!-- Play Icon (center) -->
    <circle fill="#ffffff" opacity="0.8" cx="500" cy="290" r="50"/>
    <polygon fill="#000000" points="480,270 480,310 520,290" transform="translate(0, 0)"/>
    
    <!-- Fake Video Content -->
    <text x="500" y="250" class="text-hint" text-anchor="middle" fill="#ffffff" font-size="18">🎬 视频内容区域</text>
    
    <!-- Player Controls -->
    <g transform="translate(20, 500)">
      <rect class="player-controls" width="960" height="60" rx="0"/>
      
      <!-- Play Button -->
      <polygon fill="#ffffff" points="30,20 30,40 50,30"/>
      
      <!-- Progress Bar -->
      <rect fill="#666666" x="70" y="25" width="720" height="10" rx="5"/>
      <rect fill="#1890ff" x="70" y="25" width="360" height="10" rx="5"/>
      <circle fill="#ffffff" cx="430" cy="30" r="8"/>
      
      <!-- Time -->
      <text x="810" y="35" class="text-hint" fill="#ffffff">00:30 / 02:30</text>
      
      <!-- Volume -->
      <text x="870" y="35" class="text-hint" fill="#ffffff">🔊</text>
      
      <!-- Fullscreen -->
      <text x="920" y="35" class="text-hint" fill="#ffffff">⛶</text>
    </g>
  </g>
  
  <!-- Video Info Section -->
  <g transform="translate(100, 840)">
    <rect class="card" width="1000" height="120" rx="8"/>
    
    <text x="30" y="35" class="text-normal" font-weight="bold" font-size="16">📊 视频信息</text>
    
    <g transform="translate(30, 60)">
      <text x="0" y="0" class="text-normal">⏱️ 时长: <tspan font-weight="bold">2分30秒</tspan></text>
      <text x="200" y="0" class="text-normal">📊 分辨率: <tspan font-weight="bold">1080p</tspan></text>
      <text x="400" y="0" class="text-normal">🎞️ 场景数量: <tspan font-weight="bold">10个</tspan></text>
      <text x="600" y="0" class="text-normal">💾 文件大小: <tspan font-weight="bold">45.6 MB</tspan></text>
    </g>
    
    <g transform="translate(30, 90)">
      <text x="0" y="0" class="text-hint">📅 创建时间: 2025-10-23 14:30 | ✅ 完成时间: 2025-10-23 14:35</text>
    </g>
  </g>
  
  <!-- Scene Timeline Section -->
  <g transform="translate(100, 1000)">
    <rect class="card" width="1000" height="220" rx="8"/>
    
    <text x="30" y="35" class="text-normal" font-weight="bold" font-size="16">🎞️ 场景时间轴</text>
    
    <!-- Scene Thumbnails -->
    <g transform="translate(30, 60)">
      <!-- Scene 1 - Active -->
      <g>
        <rect class="scene-thumb-active" width="120" height="80" rx="4"/>
        <text x="60" y="45" class="text-hint" text-anchor="middle" font-size="24">🏫</text>
        <text x="60" y="105" class="text-hint" text-anchor="middle">场景 1</text>
        <text x="60" y="125" class="text-hint" text-anchor="middle">00:00</text>
      </g>
      
      <!-- Scene 2 -->
      <g transform="translate(140, 0)">
        <rect class="scene-thumb" width="120" height="80" rx="4"/>
        <text x="60" y="45" class="text-hint" text-anchor="middle" font-size="24">🚶</text>
        <text x="60" y="105" class="text-hint" text-anchor="middle">场景 2</text>
        <text x="60" y="125" class="text-hint" text-anchor="middle">00:15</text>
      </g>
      
      <!-- Scene 3 -->
      <g transform="translate(280, 0)">
        <rect class="scene-thumb" width="120" height="80" rx="4"/>
        <text x="60" y="45" class="text-hint" text-anchor="middle" font-size="24">🌸</text>
        <text x="60" y="105" class="text-hint" text-anchor="middle">场景 3</text>
        <text x="60" y="125" class="text-hint" text-anchor="middle">00:30</text>
      </g>
      
      <!-- Scene 4 -->
      <g transform="translate(420, 0)">
        <rect class="scene-thumb" width="120" height="80" rx="4"/>
        <text x="60" y="45" class="text-hint" text-anchor="middle" font-size="24">👥</text>
        <text x="60" y="105" class="text-hint" text-anchor="middle">场景 4</text>
        <text x="60" y="125" class="text-hint" text-anchor="middle">00:45</text>
      </g>
      
      <!-- More indicator -->
      <text x="600" y="45" class="text-hint" font-size="24">...</text>
      <text x="600" y="105" class="text-hint" text-anchor="middle">更多场景</text>
    </g>
  </g>
  
  <!-- Actions Section -->
  <g transform="translate(100, 1260)">
    <rect class="card" width="1000" height="100" rx="8"/>
    
    <text x="30" y="35" class="text-normal" font-weight="bold" font-size="16">⚙️ 操作</text>
    
    <!-- Action Buttons -->
    <g transform="translate(30, 50)">
      <rect class="primary-btn" width="160" height="40" rx="4"/>
      <text x="80" y="27" class="text-btn" text-anchor="middle">下载视频 MP4</text>
      
      <rect class="secondary-btn" x="180" width="120" height="40" rx="4"/>
      <text x="240" y="27" class="text-normal" text-anchor="middle">分享链接</text>
      
      <rect class="danger-btn" x="320" width="100" height="40" rx="4"/>
      <text x="370" y="27" class="text-btn" text-anchor="middle" font-size="14">删除任务</text>
    </g>
  </g>
  
  <!-- Advanced Options Section (Optional) -->
  <g transform="translate(100, 1400)">
    <rect class="card" width="1000" height="140" rx="8" stroke-dasharray="5,5"/>
    
    <text x="30" y="35" class="text-normal" font-weight="bold" font-size="16">🛠️ 微调选项 (高级功能)</text>
    
    <g transform="translate(30, 60)">
      <text x="0" y="0" class="text-hint">• 调整某个场景的配音速度</text>
      <text x="0" y="25" class="text-hint">• 重新生成某个场景的图像</text>
      <text x="0" y="50" class="text-hint">• 调整字幕位置和样式</text>
    </g>
    
    <rect class="secondary-btn" x="850" y="50" width="120" height="36" rx="4"/>
    <text x="910" y="74" class="text-normal" text-anchor="middle">开始微调</text>
  </g>
</svg>
