<svg width="1200" height="1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .header { fill: #ffffff; }
      .primary-btn { fill: #1890ff; }
      .secondary-btn { fill: #ffffff; stroke: #d9d9d9; stroke-width: 1; }
      .danger-btn { fill: #ff4d4f; }
      .card { fill: #ffffff; stroke: #e8e8e8; stroke-width: 1; }
      .table-header { fill: #fafafa; }
      .status-success { fill: #52c41a; }
      .status-error { fill: #ff4d4f; }
      .checkbox { fill: #ffffff; stroke: #d9d9d9; stroke-width: 2; }
      .checkbox-checked { fill: #1890ff; stroke: #1890ff; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #262626; }
      .text-normal { font-family: Arial, sans-serif; font-size: 14px; fill: #262626; }
      .text-btn { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #ffffff; }
      .text-hint { font-family: Arial, sans-serif; font-size: 12px; fill: #8c8c8c; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="1200" height="1400"/>
  
  <!-- Header -->
  <rect class="header" width="1200" height="64" rx="0"/>
  <text x="40" y="42" class="text-title" font-size="24">🎬 TFBoys AI</text>
  <text x="1080" y="42" class="text-normal" text-anchor="middle">我的任务</text>
  
  <!-- Page Title -->
  <text x="600" y="140" class="text-title" text-anchor="middle">📚 任务历史</text>
  
  <!-- Search and Filter Bar -->
  <g transform="translate(100, 180)">
    <!-- Search Box -->
    <rect class="secondary-btn" width="300" height="40" rx="4"/>
    <text x="15" y="27" class="text-hint">🔍 搜索任务...</text>
    
    <!-- Filter Dropdown -->
    <rect class="secondary-btn" x="320" width="140" height="40" rx="4"/>
    <text x="335" y="27" class="text-normal">全部 ▼</text>
    
    <!-- Sort Dropdown -->
    <rect class="secondary-btn" x="480" width="160" height="40" rx="4"/>
    <text x="495" y="27" class="text-normal">最新优先 ▼</text>
    
    <!-- Batch Delete Button -->
    <rect class="danger-btn" x="840" width="160" height="40" rx="4"/>
    <text x="920" y="27" class="text-btn" text-anchor="middle" font-size="14">删除选中项</text>
  </g>
  
  <!-- Task List Table -->
  <g transform="translate(100, 260)">
    <rect class="card" width="1000" height="800" rx="8"/>
    
    <!-- Table Header -->
    <rect class="table-header" x="0" y="0" width="1000" height="50" rx="8 8 0 0"/>
    <g transform="translate(20, 30)">
      <!-- Select All Checkbox -->
      <rect class="checkbox-checked" width="18" height="18" rx="2"/>
      <text x="9" y="14" fill="#ffffff" text-anchor="middle" font-size="12">✓</text>
      
      <text x="40" y="14" class="text-normal" font-weight="bold">任务名称</text>
      <text x="500" y="14" class="text-normal" font-weight="bold">状态</text>
      <text x="600" y="14" class="text-normal" font-weight="bold">创建时间</text>
      <text x="780" y="14" class="text-normal" font-weight="bold">操作</text>
    </g>
    
    <!-- Task Row 1 -->
    <g transform="translate(20, 70)">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#f0f0f0" stroke-width="1"/>
      
      <!-- Checkbox -->
      <rect class="checkbox-checked" y="15" width="18" height="18" rx="2"/>
      <text x="9" y="29" fill="#ffffff" text-anchor="middle" font-size="12">✓</text>
      
      <!-- Task Name -->
      <text x="40" y="29" class="text-normal">春天的故事与少年的...</text>
      
      <!-- Status -->
      <circle class="status-success" cx="506" cy="24" r="6"/>
      <text x="520" y="29" class="text-normal" fill="#52c41a">✅ 已完成</text>
      
      <!-- Date & Info -->
      <text x="600" y="29" class="text-hint">2025-10-23 14:30</text>
      <text x="40" y="50" class="text-hint">⏱️ 2:30 | 🎞️ 10场景</text>
      
      <!-- Actions -->
      <rect class="secondary-btn" x="750" y="10" width="60" height="32" rx="4"/>
      <text x="780" y="32" class="text-normal" text-anchor="middle" font-size="12">查看</text>
      
      <rect class="secondary-btn" x="820" y="10" width="60" height="32" rx="4"/>
      <text x="850" y="32" class="text-normal" text-anchor="middle" font-size="12">下载</text>
      
      <rect class="secondary-btn" x="890" y="10" width="60" height="32" rx="4"/>
      <text x="920" y="32" class="text-normal" text-anchor="middle" font-size="12">删除</text>
    </g>
    
    <!-- Task Row 2 -->
    <g transform="translate(20, 150)">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#f0f0f0" stroke-width="1"/>
      
      <!-- Checkbox -->
      <rect class="checkbox-checked" y="15" width="18" height="18" rx="2"/>
      <text x="9" y="29" fill="#ffffff" text-anchor="middle" font-size="12">✓</text>
      
      <!-- Task Name -->
      <text x="40" y="29" class="text-normal">少年与猫的故事...</text>
      
      <!-- Status -->
      <circle class="status-success" cx="506" cy="24" r="6"/>
      <text x="520" y="29" class="text-normal" fill="#52c41a">✅ 已完成</text>
      
      <!-- Date & Info -->
      <text x="600" y="29" class="text-hint">2025-10-22 10:15</text>
      <text x="40" y="50" class="text-hint">⏱️ 3:45 | 🎞️ 15场景</text>
      
      <!-- Actions -->
      <rect class="secondary-btn" x="750" y="10" width="60" height="32" rx="4"/>
      <text x="780" y="32" class="text-normal" text-anchor="middle" font-size="12">查看</text>
      
      <rect class="secondary-btn" x="820" y="10" width="60" height="32" rx="4"/>
      <text x="850" y="32" class="text-normal" text-anchor="middle" font-size="12">下载</text>
      
      <rect class="secondary-btn" x="890" y="10" width="60" height="32" rx="4"/>
      <text x="920" y="32" class="text-normal" text-anchor="middle" font-size="12">删除</text>
    </g>
    
    <!-- Task Row 3 - Failed -->
    <g transform="translate(20, 230)">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#f0f0f0" stroke-width="1"/>
      
      <!-- Checkbox -->
      <rect class="checkbox" y="15" width="18" height="18" rx="2"/>
      
      <!-- Task Name -->
      <text x="40" y="29" class="text-normal">星际旅行与未知的...</text>
      
      <!-- Status -->
      <circle class="status-error" cx="506" cy="24" r="6"/>
      <text x="520" y="29" class="text-normal" fill="#ff4d4f">❌ 失败</text>
      
      <!-- Date -->
      <text x="600" y="29" class="text-hint">2025-10-21 16:20</text>
      <text x="40" y="50" class="text-hint" fill="#ff4d4f">错误: API限流</text>
      
      <!-- Actions -->
      <rect class="primary-btn" x="750" y="10" width="60" height="32" rx="4"/>
      <text x="780" y="32" class="text-btn" text-anchor="middle" font-size="12">重试</text>
      
      <rect class="secondary-btn" x="820" y="10" width="60" height="32" rx="4"/>
      <text x="850" y="32" class="text-normal" text-anchor="middle" font-size="12">删除</text>
    </g>
    
    <!-- Task Row 4 -->
    <g transform="translate(20, 310)">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#f0f0f0" stroke-width="1"/>
      
      <!-- Checkbox -->
      <rect class="checkbox" y="15" width="18" height="18" rx="2"/>
      
      <!-- Task Name -->
      <text x="40" y="29" class="text-normal">古风武侠传说...</text>
      
      <!-- Status -->
      <circle class="status-success" cx="506" cy="24" r="6"/>
      <text x="520" y="29" class="text-normal" fill="#52c41a">✅ 已完成</text>
      
      <!-- Date & Info -->
      <text x="600" y="29" class="text-hint">2025-10-20 09:30</text>
      <text x="40" y="50" class="text-hint">⏱️ 4:20 | 🎞️ 18场景</text>
      
      <!-- Actions -->
      <rect class="secondary-btn" x="750" y="10" width="60" height="32" rx="4"/>
      <text x="780" y="32" class="text-normal" text-anchor="middle" font-size="12">查看</text>
      
      <rect class="secondary-btn" x="820" y="10" width="60" height="32" rx="4"/>
      <text x="850" y="32" class="text-normal" text-anchor="middle" font-size="12">下载</text>
      
      <rect class="secondary-btn" x="890" y="10" width="60" height="32" rx="4"/>
      <text x="920" y="32" class="text-normal" text-anchor="middle" font-size="12">删除</text>
    </g>
    
    <!-- Task Row 5 -->
    <g transform="translate(20, 390)">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#f0f0f0" stroke-width="1"/>
      
      <!-- Checkbox -->
      <rect class="checkbox" y="15" width="18" height="18" rx="2"/>
      
      <!-- Task Name -->
      <text x="40" y="29" class="text-normal">现代都市爱情故事...</text>
      
      <!-- Status -->
      <circle class="status-success" cx="506" cy="24" r="6"/>
      <text x="520" y="29" class="text-normal" fill="#52c41a">✅ 已完成</text>
      
      <!-- Date & Info -->
      <text x="600" y="29" class="text-hint">2025-10-19 15:45</text>
      <text x="40" y="50" class="text-hint">⏱️ 3:10 | 🎞️ 12场景</text>
      
      <!-- Actions -->
      <rect class="secondary-btn" x="750" y="10" width="60" height="32" rx="4"/>
      <text x="780" y="32" class="text-normal" text-anchor="middle" font-size="12">查看</text>
      
      <rect class="secondary-btn" x="820" y="10" width="60" height="32" rx="4"/>
      <text x="850" y="32" class="text-normal" text-anchor="middle" font-size="12">下载</text>
      
      <rect class="secondary-btn" x="890" y="10" width="60" height="32" rx="4"/>
      <text x="920" y="32" class="text-normal" text-anchor="middle" font-size="12">删除</text>
    </g>
    
    <!-- More rows indicator -->
    <text x="500" y="530" class="text-hint" text-anchor="middle">...</text>
  </g>
  
  <!-- Pagination -->
  <g transform="translate(400, 1100)">
    <rect class="secondary-btn" width="80" height="40" rx="4"/>
    <text x="40" y="27" class="text-normal" text-anchor="middle">上一页</text>
    
    <text x="140" y="27" class="text-normal">1 / 5</text>
    
    <rect class="secondary-btn" x="220" width="80" height="40" rx="4"/>
    <text x="260" y="27" class="text-normal" text-anchor="middle">下一页</text>
  </g>
  
  <!-- Statistics -->
  <g transform="translate(100, 1180)">
    <rect fill="#f0f0f0" width="1000" height="60" rx="4"/>
    <text x="30" y="38" class="text-hint">📊 统计信息: 共 25 个任务 | 22 个已完成 | 1 个失败 | 2 个进行中</text>
  </g>
</svg>
