<svg width="1200" height="1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .header { fill: #ffffff; }
      .primary-btn { fill: #1890ff; }
      .secondary-btn { fill: #ffffff; stroke: #d9d9d9; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #e8e8e8; stroke-width: 1; }
      .text-title { font-family: Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #262626; }
      .text-subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #595959; }
      .text-normal { font-family: Arial, sans-serif; font-size: 14px; fill: #262626; }
      .text-btn { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #ffffff; }
      .text-btn-secondary { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #595959; }
      .icon { fill: #1890ff; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="1200" height="1400"/>
  
  <!-- Header -->
  <rect class="header" width="1200" height="64" rx="0"/>
  <text x="40" y="42" class="text-title" font-size="24">🎬 TFBoys AI</text>
  <text x="1080" y="42" class="text-normal" text-anchor="middle">登录</text>
  
  <!-- Hero Section -->
  <g transform="translate(0, 120)">
    <text x="600" y="60" class="text-title" text-anchor="middle" font-size="48">将小说变成动漫视频</text>
    <text x="600" y="110" class="text-subtitle" text-anchor="middle">AI 驱动，一键生成，角色一致</text>
    
    <!-- CTA Buttons -->
    <g transform="translate(380, 150)">
      <rect class="primary-btn" width="180" height="48" rx="4"/>
      <text x="90" y="32" class="text-btn" text-anchor="middle">开始创作</text>
    </g>
    <g transform="translate(580, 150)">
      <rect class="secondary-btn" width="180" height="48" rx="4"/>
      <text x="90" y="32" class="text-btn-secondary" text-anchor="middle">查看示例</text>
    </g>
  </g>
  
  <!-- Process Flow -->
  <g transform="translate(0, 420)">
    <text x="600" y="0" class="text-title" text-anchor="middle" font-size="28">简单三步，轻松创作</text>
    
    <!-- Step 1 -->
    <g transform="translate(150, 60)">
      <circle class="icon" cx="50" cy="50" r="40"/>
      <text x="50" y="60" class="text-btn" text-anchor="middle" font-size="32">1</text>
      <text x="50" y="140" class="text-normal" text-anchor="middle" font-weight="bold">📝 输入小说</text>
      <text x="50" y="165" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">文本/文件/URL</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 290 110 L 410 110" stroke="#1890ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Step 2 -->
    <g transform="translate(450, 60)">
      <circle class="icon" cx="50" cy="50" r="40"/>
      <text x="50" y="60" class="text-btn" text-anchor="middle" font-size="32">2</text>
      <text x="50" y="140" class="text-normal" text-anchor="middle" font-weight="bold">🎨 AI生成</text>
      <text x="50" y="165" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">场景/配音/视频</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 590 110 L 710 110" stroke="#1890ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Step 3 -->
    <g transform="translate(750, 60)">
      <circle class="icon" cx="50" cy="50" r="40"/>
      <text x="50" y="60" class="text-btn" text-anchor="middle" font-size="32">3</text>
      <text x="50" y="140" class="text-normal" text-anchor="middle" font-weight="bold">🎬 导出视频</text>
      <text x="50" y="165" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">下载/分享</text>
    </g>
  </g>
  
  <!-- Features Section -->
  <g transform="translate(0, 720)">
    <text x="600" y="0" class="text-title" text-anchor="middle" font-size="28">🌟 核心特性</text>
    
    <!-- Feature Card 1 -->
    <g transform="translate(120, 60)">
      <rect class="card" width="220" height="200" rx="8"/>
      <text x="110" y="70" class="text-title" text-anchor="middle" font-size="48">👥</text>
      <text x="110" y="120" class="text-normal" text-anchor="middle" font-weight="bold">角色一致性</text>
      <text x="110" y="145" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">AI保证角色形象</text>
      <text x="110" y="165" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">在不同场景中一致</text>
    </g>
    
    <!-- Feature Card 2 -->
    <g transform="translate(380, 60)">
      <rect class="card" width="220" height="200" rx="8"/>
      <text x="110" y="70" class="text-title" text-anchor="middle" font-size="48">🎙️</text>
      <text x="110" y="120" class="text-normal" text-anchor="middle" font-weight="bold">自动配音</text>
      <text x="110" y="145" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">多种音色选择</text>
      <text x="110" y="165" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">高质量语音合成</text>
    </g>
    
    <!-- Feature Card 3 -->
    <g transform="translate(640, 60)">
      <rect class="card" width="220" height="200" rx="8"/>
      <text x="110" y="70" class="text-title" text-anchor="middle" font-size="48">🎨</text>
      <text x="110" y="120" class="text-normal" text-anchor="middle" font-weight="bold">多种风格</text>
      <text x="110" y="145" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">古风/现代/动漫</text>
      <text x="110" y="165" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">满足不同需求</text>
    </g>
    
    <!-- Feature Card 4 -->
    <g transform="translate(900, 60)">
      <rect class="card" width="220" height="200" rx="8"/>
      <text x="110" y="70" class="text-title" text-anchor="middle" font-size="48">⚡</text>
      <text x="110" y="120" class="text-normal" text-anchor="middle" font-weight="bold">快速生成</text>
      <text x="110" y="145" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">自动化流程</text>
      <text x="110" y="165" class="text-normal" text-anchor="middle" font-size="12" fill="#8c8c8c">分钟级出片</text>
    </g>
  </g>
  
  <!-- Footer -->
  <g transform="translate(0, 1280)">
    <rect fill="#ffffff" width="1200" height="120"/>
    <text x="600" y="40" class="text-normal" text-anchor="middle" fill="#8c8c8c">© 2025 TFBoys AI - 让创作更简单</text>
    <text x="600" y="70" class="text-normal" text-anchor="middle" fill="#8c8c8c" font-size="12">关于我们 | 帮助文档 | 联系方式</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1890ff"/>
    </marker>
  </defs>
</svg>
