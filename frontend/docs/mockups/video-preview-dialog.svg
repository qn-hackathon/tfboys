<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .overlay { fill: rgba(0, 0, 0, 0.5); }
      .dialog-bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1; }
      .text-title { fill: #020617; font-size: 16px; font-weight: 600; font-family: Inter, Arial, sans-serif; }
      .text-body { fill: #475569; font-size: 14px; font-family: Inter, Arial, sans-serif; }
      .text-small { fill: #64748b; font-size: 12px; font-family: Inter, Arial, sans-serif; }
      .text-xs { fill: #94a3b8; font-size: 11px; font-family: Inter, Arial, sans-serif; }
      .text-white { fill: #ffffff; font-size: 14px; font-family: Inter, Arial, sans-serif; }
      .button-outline { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .card-bg { fill: #f8fafc; }
      .progress-bg { fill: #64748b; }
      .progress-fill { fill: hsl(221.2, 83.2%, 53.3%); }
    </style>
  </defs>

  <!-- 半透明背景遮罩 -->
  <rect class="overlay" x="0" y="0" width="1200" height="800"/>
  
  <!-- 弹窗容器 -->
  <rect class="dialog-bg" x="100" y="30" width="1000" height="740" rx="12"/>
  
  <!-- 关闭按钮 -->
  <circle class="button-outline" cx="1070" cy="60" r="18"/>
  <text x="1064" y="67" font-size="18" fill="#64748b">✕</text>
  
  <!-- 左侧区域：视频播放 (60% 宽度) -->
  <g id="left-area">
    <!-- 操作按钮组 (右对齐) -->
    <circle class="button-outline" cx="580" cy="105" r="20"/>
    <text x="573" y="112" font-size="18" fill="hsl(221.2, 83.2%, 53.3%)">⬇</text>
    <circle class="button-outline" cx="625" cy="105" r="20"/>
    <text x="618" y="112" font-size="18" fill="hsl(221.2, 83.2%, 53.3%)">🔗</text>
    <circle class="button-outline" cx="670" cy="105" r="20"/>
    <text x="663" y="112" font-size="18" fill="#ef4444">🗑</text>
    
    <!-- 视频播放器 16:9 -->
    <rect fill="#000000" x="130" y="140" width="560" height="315" rx="8"/>
    <circle fill="rgba(255,255,255,0.9)" cx="410" cy="298" r="45"/>
    <text fill="#000000" x="397" y="316" font-size="42">▶</text>
    
    <!-- 播放器控制条 -->
    <rect fill="rgba(0,0,0,0.7)" x="130" y="415" width="560" height="40"/>
    <rect class="progress-bg" x="150" y="428" width="480" height="4" rx="2"/>
    <rect class="progress-fill" x="150" y="428" width="160" height="4" rx="2"/>
    <text class="text-white" x="150" y="448" font-size="11">00:30 / 02:30</text>
    <text class="text-white" x="620" y="448" font-size="11">🔊 ⚙️ ⛶</text>
    
    <!-- 视频切片 Carousel -->
    <text class="text-title" x="130" y="485">🎞️ 视频切片</text>
    <rect class="card-bg border" x="130" y="495" width="560" height="100" rx="8"/>
    
    <!-- 左箭头 -->
    <circle class="button-outline" cx="150" cy="545" r="14"/>
    <text x="146" y="550" font-size="14">◀</text>
    
    <!-- 切片1 - 选中状态 -->
    <rect x="180" y="510" width="100" height="70" rx="4" fill="#cbd5e1" stroke="hsl(221.2, 83.2%, 53.3%)" stroke-width="2"/>
    <text class="text-small" x="210" y="550" fill="#020617" font-weight="600">场景 1</text>
    <text class="text-xs" x="215" y="570" fill="hsl(221.2, 83.2%, 53.3%)" font-weight="600">0:00</text>
    
    <!-- 切片2 -->
    <rect x="290" y="510" width="100" height="70" rx="4" fill="#cbd5e1" stroke="#e2e8f0" stroke-width="1"/>
    <text class="text-small" x="320" y="550" fill="#64748b">场景 2</text>
    <text class="text-xs" x="325" y="570" fill="#64748b">0:15</text>
    
    <!-- 切片3 -->
    <rect x="400" y="510" width="100" height="70" rx="4" fill="#cbd5e1" stroke="#e2e8f0" stroke-width="1"/>
    <text class="text-small" x="430" y="550" fill="#64748b">场景 3</text>
    <text class="text-xs" x="435" y="570" fill="#64748b">0:30</text>
    
    <!-- 切片4 -->
    <rect x="510" y="510" width="100" height="70" rx="4" fill="#cbd5e1" stroke="#e2e8f0" stroke-width="1"/>
    <text class="text-small" x="540" y="550" fill="#64748b">场景 4</text>
    <text class="text-xs" x="545" y="570" fill="#64748b">0:45</text>
    
    <!-- 右箭头 -->
    <circle class="button-outline" cx="660" cy="545" r="14"/>
    <text x="656" y="550" font-size="14">▶</text>
    
    <!-- 指示点 -->
    <circle fill="hsl(221.2, 83.2%, 53.3%)" cx="385" cy="590" r="3"/>
    <circle fill="#cbd5e1" cx="400" cy="590" r="3"/>
    <circle fill="#cbd5e1" cx="415" cy="590" r="3"/>
    
    <!-- 提示文字 -->
    <text class="text-xs" x="130" y="620">点击切片可跳转到对应场景</text>
  </g>
  
  <!-- 右侧区域：视频信息 (40% 宽度) -->
  <g id="right-area">
    <!-- 小说 Prompt -->
    <text class="text-title" x="720" y="115">📄 小说 Prompt</text>
    <rect class="card-bg border" x="720" y="125" width="350" height="120" rx="6"/>
    <text class="text-small" x="735" y="150">春天的故事，一个少年与一只流浪</text>
    <text class="text-small" x="735" y="170">猫的温暖相遇。在樱花盛开的季</text>
    <text class="text-small" x="735" y="190">节，他们一起度过了难忘的时光，</text>
    <text class="text-small" x="735" y="210">彼此治愈着对方的心灵...</text>
    
    <!-- 分割线 -->
    <line x1="720" y1="260" x2="1070" y2="260" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- 时长 -->
    <text class="text-body" x="720" y="285">⏱️ 时长：</text>
    <text class="text-body" x="805" y="285" fill="#020617" font-weight="600">2:30</text>
    
    <line x1="720" y1="300" x2="1070" y2="300" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- 分辨率 -->
    <text class="text-body" x="720" y="325">📺 分辨率：</text>
    <text class="text-body" x="835" y="325" fill="#020617" font-weight="600">1080p</text>
    
    <line x1="720" y1="340" x2="1070" y2="340" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- 视频横纵比 -->
    <text class="text-body" x="720" y="365">📐 视频横纵比：</text>
    <text class="text-body" x="875" y="365" fill="#020617" font-weight="600">16:9</text>
  </g>
</svg>