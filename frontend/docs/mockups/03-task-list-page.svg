<svg width="1200" height="1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .header { fill: #ffffff; }
      .primary-btn { fill: #1890ff; }
      .secondary-btn { fill: #ffffff; stroke: #d9d9d9; stroke-width: 1; }
      .danger-btn { fill: #ff4d4f; }
      .card { fill: #ffffff; stroke: #e8e8e8; stroke-width: 1; }
      .tab-active { fill: #1890ff; }
      .tab-inactive { fill: #f0f0f0; }
      .progress-bg { fill: #f0f0f0; }
      .progress-fill { fill: #1890ff; }
      .status-processing { fill: #1890ff; }
      .status-success { fill: #52c41a; }
      .status-error { fill: #ff4d4f; }
      .text-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #262626; }
      .text-normal { font-family: Arial, sans-serif; font-size: 14px; fill: #262626; }
      .text-btn { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #ffffff; }
      .text-hint { font-family: Arial, sans-serif; font-size: 12px; fill: #8c8c8c; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="1200" height="1400"/>
  
  <!-- Header -->
  <rect class="header" width="1200" height="64" rx="0"/>
  <text x="40" y="42" class="text-title" font-size="24">🎬 TFBoys AI</text>
  <text x="1080" y="42" class="text-normal" text-anchor="middle">我的任务</text>
  
  <!-- Page Title -->
  <text x="600" y="140" class="text-title" text-anchor="middle">📋 我的任务</text>
  
  <!-- Filter Tabs -->
  <g transform="translate(200, 180)">
    <rect class="tab-active" width="100" height="40" rx="4"/>
    <text x="50" y="27" class="text-btn" text-anchor="middle" font-size="14">全部</text>
    
    <rect class="tab-inactive" x="120" width="100" height="40" rx="4"/>
    <text x="170" y="27" class="text-normal" text-anchor="middle">进行中</text>
    
    <rect class="tab-inactive" x="240" width="100" height="40" rx="4"/>
    <text x="290" y="27" class="text-normal" text-anchor="middle">已完成</text>
    
    <rect class="tab-inactive" x="360" width="100" height="40" rx="4"/>
    <text x="410" y="27" class="text-normal" text-anchor="middle">失败</text>
    
    <!-- Search Box -->
    <rect class="secondary-btn" x="500" width="200" height="40" rx="4"/>
    <text x="520" y="27" class="text-hint">🔍 搜索任务...</text>
  </g>
  
  <!-- Task Card 1 - Processing -->
  <g transform="translate(100, 260)">
    <rect class="card" width="1000" height="200" rx="8"/>
    
    <!-- Task Header -->
    <text x="30" y="35" class="text-normal" font-weight="bold" font-size="16">任务 #001: 春天的故事与少年的...</text>
    <text x="950" y="35" class="text-hint" text-anchor="end">创建于: 2025-10-24 14:30</text>
    
    <!-- Status Badge -->
    <g transform="translate(30, 50)">
      <circle class="status-processing" cx="6" cy="0" r="6"/>
      <text x="20" y="5" class="text-normal" fill="#1890ff">🔄 图像生成中</text>
    </g>
    
    <!-- Progress Bar -->
    <g transform="translate(30, 80)">
      <rect class="progress-bg" width="940" height="20" rx="10"/>
      <rect class="progress-fill" width="564" height="20" rx="10"/>
      <text x="470" y="15" class="text-normal" fill="#ffffff" text-anchor="middle" font-size="12">60%</text>
    </g>
    
    <!-- Progress Details -->
    <text x="30" y="130" class="text-hint">已处理场景: 6 / 10</text>
    <text x="30" y="150" class="text-hint">当前阶段: 正在生成第7个场景的图像</text>
    <text x="30" y="170" class="text-hint">⏱️ 预计剩余时间: 2分钟</text>
    
    <!-- Action Buttons -->
    <rect class="secondary-btn" x="780" y="140" width="100" height="36" rx="4"/>
    <text x="830" y="164" class="text-normal" text-anchor="middle">查看详情</text>
    
    <rect class="danger-btn" x="900" y="140" width="70" height="36" rx="4"/>
    <text x="935" y="164" class="text-btn" text-anchor="middle" font-size="14">取消</text>
  </g>
  
  <!-- Task Card 2 - Completed -->
  <g transform="translate(100, 490)">
    <rect class="card" width="1000" height="200" rx="8"/>
    
    <!-- Thumbnail -->
    <rect fill="#f0f0f0" x="30" y="30" width="140" height="100" rx="4"/>
    <text x="100" y="85" class="text-hint" text-anchor="middle" font-size="32">🎬</text>
    
    <!-- Task Info -->
    <text x="190" y="50" class="text-normal" font-weight="bold" font-size="16">任务 #002: 少年与猫的故事...</text>
    
    <!-- Status Badge -->
    <g transform="translate(190, 70)">
      <circle class="status-success" cx="6" cy="0" r="6"/>
      <text x="20" y="5" class="text-normal" fill="#52c41a">✅ 已完成</text>
    </g>
    
    <!-- Video Info -->
    <text x="190" y="105" class="text-hint">⏱️ 时长: 2:30 | 📊 分辨率: 1080p | 🎞️ 场景数: 10个</text>
    <text x="190" y="125" class="text-hint">📅 创建时间: 2025-10-23 14:30 | ✅ 完成时间: 2025-10-23 14:35</text>
    
    <!-- Action Buttons -->
    <rect class="primary-btn" x="640" y="140" width="100" height="36" rx="4"/>
    <text x="690" y="164" class="text-btn" text-anchor="middle" font-size="14">查看视频</text>
    
    <rect class="secondary-btn" x="760" y="140" width="80" height="36" rx="4"/>
    <text x="800" y="164" class="text-normal" text-anchor="middle">下载</text>
    
    <rect class="secondary-btn" x="860" y="140" width="80" height="36" rx="4"/>
    <text x="900" y="164" class="text-normal" text-anchor="middle">删除</text>
  </g>
  
  <!-- Task Card 3 - Failed -->
  <g transform="translate(100, 720)">
    <rect class="card" width="1000" height="200" rx="8"/>
    
    <!-- Task Header -->
    <text x="30" y="35" class="text-normal" font-weight="bold" font-size="16">任务 #003: 星际旅行与未知的...</text>
    <text x="950" y="35" class="text-hint" text-anchor="end">创建于: 2025-10-22 10:15</text>
    
    <!-- Status Badge -->
    <g transform="translate(30, 50)">
      <circle class="status-error" cx="6" cy="0" r="6"/>
      <text x="20" y="5" class="text-normal" fill="#ff4d4f">❌ 失败</text>
    </g>
    
    <!-- Error Message -->
    <g transform="translate(30, 80)">
      <rect fill="#fff2f0" width="940" height="60" rx="4" stroke="#ffccc7" stroke-width="1"/>
      <text x="20" y="25" class="text-normal" fill="#ff4d4f">❌ 错误原因:</text>
      <text x="20" y="48" class="text-hint" fill="#ff4d4f">图像生成API限流，请稍后重试。建议降低并发数或等待5分钟后重试。</text>
    </g>
    
    <!-- Action Buttons -->
    <rect class="primary-btn" x="780" y="160" width="100" height="36" rx="4"/>
    <text x="830" y="184" class="text-btn" text-anchor="middle" font-size="14">重试</text>
    
    <rect class="secondary-btn" x="900" y="160" width="70" height="36" rx="4"/>
    <text x="935" y="184" class="text-normal" text-anchor="middle">删除</text>
  </g>
  
  <!-- Pagination -->
  <g transform="translate(400, 980)">
    <rect class="secondary-btn" width="80" height="40" rx="4"/>
    <text x="40" y="27" class="text-normal" text-anchor="middle">上一页</text>
    
    <text x="140" y="27" class="text-normal">1 / 3</text>
    
    <rect class="secondary-btn" x="220" width="80" height="40" rx="4"/>
    <text x="260" y="27" class="text-normal" text-anchor="middle">下一页</text>
  </g>
  
  <!-- Auto Refresh Indicator -->
  <g transform="translate(500, 1080)">
    <circle fill="#52c41a" cx="0" cy="0" r="4"/>
    <text x="12" y="5" class="text-hint">自动刷新中 (每5秒)</text>
  </g>
</svg>
