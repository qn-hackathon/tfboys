<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-main { fill: #f8fafc; }
      .header-bg { fill: #ffffff; }
      .sidebar-bg { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .border { stroke: #e2e8f0; stroke-width: 1; }
      .text-title { fill: #020617; font-size: 16px; font-weight: 600; font-family: Inter, Arial, sans-serif; }
      .text-body { fill: #475569; font-size: 14px; font-family: Inter, Arial, sans-serif; }
      .text-small { fill: #64748b; font-size: 12px; font-family: Inter, Arial, sans-serif; }
      .text-xs { fill: #94a3b8; font-size: 11px; font-family: Inter, Arial, sans-serif; }
      .button-primary { fill: hsl(221.2, 83.2%, 53.3%); }
      .button-outline { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .text-white { fill: #ffffff; font-size: 14px; font-family: Inter, Arial, sans-serif; }
      .tab-active { fill: #ffffff; }
      .tab-inactive { fill: #f8fafc; }
      .selected { stroke: hsl(221.2, 83.2%, 53.3%); stroke-width: 2; }
      .radio-checked { fill: hsl(221.2, 83.2%, 53.3%); }
      .progress-bg { fill: #e2e8f0; }
      .progress-fill { fill: hsl(221.2, 83.2%, 53.3%); }
      .sidebar-active-bg { fill: #f1f5f9; }
      .sidebar-active-text { fill: hsl(221.2, 83.2%, 53.3%); font-weight: 600; }
    </style>
  </defs>

  <rect class="bg-main" x="0" y="0" width="1400" height="900"/>

  <!-- 1. 顶部栏 (Header) -->
  <g id="header">
    <rect class="header-bg border" x="0" y="0" width="1400" height="60"/>
    <text x="20" y="38" font-size="18" font-weight="bold" fill="#020617">TFBoys AI</text>
    <text class="text-body" x="1050" y="38">额度: 100 分钟</text>
    <text class="text-body" x="1180" y="38">👤 用户名 ▼</text>
    <text x="1280" y="38" font-size="18">🌙</text>
    <text x="1330" y="38" font-size="18">🔔</text>
    <circle fill="hsl(0, 84.2%, 60.2%)" cx="1342" cy="26" r="5"/>
  </g>

  <!-- 2. 侧边栏 (Sidebar) -->
  <g id="sidebar">
    <rect class="sidebar-bg border" x="0" y="60" width="240" height="840"/>
    
    <!-- 视频生成 - 选中状态 -->
    <rect class="sidebar-active-bg" x="10" y="80" width="220" height="56" rx="6"/>
    <path d="M10 86 a6,6 0 0,1 6,-6 h-3 v56 h3 a6,6 0 0,1 -6,-6 z" fill="hsl(221.2, 83.2%, 53.3%)" />
    <text class="sidebar-active-text" x="40" y="110" font-size="14">📹 视频生成</text>
    
    <!-- 我的任务 -->
    <text class="text-body" x="40" y="166" font-size="14">📋 我的任务</text>
    <rect fill="#fca5a5" x="120" y="152" width="20" height="20" rx="10"/>
    <text fill="#b91c1c" x="126" y="166" font-size="12">3</text>
  </g>

  <!-- 3. 内容区域 (Main Content) -->
  <g id="main-content" transform="translate(240, 60)">
    <rect class="bg-main" x="0" y="0" width="1160" height="840"/>
    
    <!-- 左侧输入与配置区域 -->
    <g id="left-panel" transform="translate(20, 20)">
      <rect class="card" x="0" y="0" width="560" height="800" rx="8"/>
      <text class="text-title" x="20" y="30">📝 输入小说内容</text>
      
      <rect class="tab-active" x="20" y="45" width="100" height="36" rx="6"/>
      <text class="text-body" x="40" y="68" fill="#020617">直接输入</text>
      
      <rect class="tab-inactive" x="130" y="45" width="100" height="36" rx="6"/>
      <text class="text-body" x="145" y="68">上传文件</text>
      
      <rect fill="#f1f5f9" x="20" y="95" width="520" height="200" rx="8" stroke="#cbd5e1" stroke-width="1"/>
      <text class="text-small" x="35" y="120" fill="#94a3b8">在这里输入或粘贴小说内容...</text>
      
      <text class="text-xs" x="20" y="315">字数: 0 / 10,000 字</text>
      <text class="text-xs" x="180" y="315" fill="#3b82f6">💡 建议 500-5000 字</text>
      
      <text class="text-title" x="20" y="360">⚙️ 配置视频参数</text>
      <text class="text-body" x="20" y="390">视频风格:</text>
      
      <rect class="card selected" x="20" y="405" width="90" height="80" rx="6" fill="#dbeafe"/>
      <text x="45" y="435" font-size="24">🏮</text>
      <text class="text-small" x="42" y="465" fill="#020617">古风</text>
      <circle fill="hsl(221.2, 83.2%, 53.3%)" cx="95" cy="415" r="8"/>
      <text fill="#ffffff" x="92" y="420" font-size="10">✓</text>
      
      <rect class="card" x="120" y="405" width="90" height="80" rx="6"/>
      <text x="145" y="435" font-size="24">🏙️</text>
      <text class="text-small" x="140" y="465">现代</text>
      
      <rect class="card" x="220" y="405" width="90" height="80" rx="6"/>
      <text x="245" y="435" font-size="24">🎨</text>
      <text class="text-small" x="240" y="465">动漫</text>
      
      <text class="text-body" x="20" y="515">配音类型:</text>
      <circle class="radio-checked" cx="125" cy="510" r="8"/>
      <circle fill="#ffffff" cx="125" cy="510" r="3"/>
      <text class="text-body" x="140" y="515">男声</text>
      
      <text class="text-body" x="20" y="575">视频分辨率:</text>
      <circle class="radio-checked" cx="145" cy="570" r="8"/>
      <circle fill="#ffffff" cx="145" cy="570" r="3"/>
      <text class="text-body" x="160" y="575">1080p (高清)</text>
      
      <rect class="button-primary" x="20" y="740" width="520" height="44" rx="8"/>
      <text class="text-white" x="225" y="768" font-size="16" font-weight="600">生成视频</text>
    </g>

    <!-- 右侧预览与展示区域 -->
    <g id="right-panel" transform="translate(600, 20)">
      <rect class="card" x="0" y="0" width="540" height="800" rx="8"/>
      <text class="text-title" x="20" y="30">🎬 预览</text>
      
      <rect fill="#000000" x="20" y="50" width="500" height="281" rx="8"/>
      <circle fill="rgba(255,255,255,0.9)" cx="270" cy="190" r="40"/>
      <text fill="#000000" x="255" y="205" font-size="36">▶</text>
      
      <text class="text-body" x="20" y="360">生成进度:</text>
      <rect class="progress-bg" x="20" y="370" width="500" height="8" rx="4"/>
      <rect class="progress-fill" x="20" y="370" width="250" height="8" rx="4"/>
      <text class="text-small" x="480" y="378" fill="hsl(221.2, 83.2%, 53.3%)" font-weight="600">50%</text>
      
      <rect class="button-outline" x="20" y="400" width="120" height="40" rx="6"/>
      <text class="text-body" x="40" y="425">🔄 重新生成</text>
      
      <rect class="button-primary" x="155" y="400" width="120" height="40" rx="6"/>
      <text class="text-white" x="175" y="425">⬇️ 下载视频</text>
      
      <text class="text-title" x="20" y="470">🎞️ 视频切片</text>
      <rect fill="#f8fafc" x="20" y="480" width="500" height="130" rx="8" class="border"/>
      <circle class="button-outline" cx="50" cy="545" r="18"/>
      <text x="44" y="552" font-size="16">◀</text>
      
      <rect x="85" y="500" width="120" height="90" rx="6" fill="#cbd5e1" class="selected"/>
      <text class="text-small" x="125" y="550" fill="#020617" font-weight="600">场景 1</text>
      
      <circle class="button-outline" cx="490" cy="545" r="18"/>
      <text x="484" y="552" font-size="16">▶</text>
      
      <text class="text-title" x="20" y="640">📚 模板视频</text>
      <rect fill="#f8fafc" x="20" y="650" width="500" height="100" rx="8" class="border"/>
    </g>
  </g>
</svg>
