version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: tfboys-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tfboys-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: tfboys-api-gateway
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8002
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tfboys-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: tfboys-ai-service
    ports:
      - "8002:8002"
    env_file:
      - ./backend/ai-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VIDEO_SERVICE_URL=http://video-service:8003
      - LOCAL_STORAGE_DIR=/tmp/tfboys
    volumes:
      - tfboys-storage:/tmp/tfboys
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tfboys-network
    restart: unless-stopped

  ai-worker:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: tfboys-ai-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/ai-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VIDEO_SERVICE_URL=http://video-service:8003
      - LOCAL_STORAGE_DIR=/tmp/tfboys
    volumes:
      - tfboys-storage:/tmp/tfboys
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - tfboys-network
    restart: unless-stopped

  video-service:
    build:
      context: ./backend/video-service
      dockerfile: Dockerfile
    container_name: tfboys-video-service
    ports:
      - "8003:8003"
    env_file:
      - ./backend/video-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_STORAGE_DIR=/tmp/tfboys
      - AI_SERVICE_CALLBACK_URL=http://ai-service:8002/callbacks/video-completed
    volumes:
      - tfboys-storage:/tmp/tfboys
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tfboys-network
    restart: unless-stopped

  video-worker:
    build:
      context: ./backend/video-service
      dockerfile: Dockerfile
    container_name: tfboys-video-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/video-service/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_STORAGE_DIR=/tmp/tfboys
      - AI_SERVICE_CALLBACK_URL=http://ai-service:8002/callbacks/video-completed
    volumes:
      - tfboys-storage:/tmp/tfboys
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy
      video-service:
        condition: service_started
    networks:
      - tfboys-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tfboys-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - tfboys-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  tfboys-network:
    driver: bridge

volumes:
  redis-data:
  tfboys-storage:
